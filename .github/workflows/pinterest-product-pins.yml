name: Pinterest daily product-in-use pin

on:
  schedule:
    - cron: "17 13 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the next prepared recipe/product pin without posting"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

concurrency:
  group: pinterest-daily-product-pins
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install recipe and image-processing dependencies
        run: npm ci
      - name: Publish one prepared product pin
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://www.grandmarecipe.com
          CI: "true"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          node --import tsx scripts/pinterest/product-pins.mjs $ARGS
      - name: Save daily publishing receipts
        if: always() && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false')
        run: |
          git add -- pinterest-product-pins public/pinterest-product-pins
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record daily Pinterest product pin [skip actions]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
